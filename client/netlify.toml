[build]
  command = "npm install && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"
  DISABLE_ESLINT_PLUGIN = "true"

# Keep browser requests same-origin; Netlify proxies API traffic to Render.
[[redirects]]
  from = "/api/*"
  to = "https://chalchitra-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://chalchitra-backend.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/hero/*"
  to = "https://chalchitra-backend.onrender.com/hero/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/about/*"
  to = "https://chalchitra-backend.onrender.com/about/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/gallery/*"
  to = "https://chalchitra-backend.onrender.com/gallery/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/team/*"
  to = "https://chalchitra-backend.onrender.com/team/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/logos/*"
  to = "https://chalchitra-backend.onrender.com/logos/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/misc/*"
  to = "https://chalchitra-backend.onrender.com/misc/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/favicons/*"
  to = "https://chalchitra-backend.onrender.com/favicons/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://chalchitra-backend.onrender.com/health"
  status = 200
  force = true

# React SPA fallback must remain last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200